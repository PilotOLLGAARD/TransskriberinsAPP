name: Udgiv appen

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  udgiv:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.udgivelse.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: udgivelse
        uses: actions/deploy-pages@v4
