name: Udgiv serveren

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Login hos Google uden fast nøgle (Workload Identity Federation).

jobs:
  udgiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: transskribering
          source: server
          region: europe-north2
          flags: --use-http2 --timeout=900 --max-instances=3 --min-instances=0 --memory=512Mi
          env_vars: |-
            ENTRA_TENANT_ID=0aefac4e-4313-4168-9865-27d269eaeff8
            ENTRA_CLIENT_ID=792bac2e-d895-4c24-9a58-7466eb8d03a3
            TILLADT_OPRINDELSE=${{ vars.TILLADT_OPRINDELSE }}
            GEMINI_MODEL=gemini-3.5-transcribe
            SPROG=da-DK
            TRANSSKRIPTION_TILSTAND=smart
          secrets: |-
            GEMINI_API_KEY=gemini-api-key:${{ vars.GEMINI_NOEGLE_VERSION }}
